name: Test additional-packages input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          distribution: Ubuntu-22.04
          additional-packages: git curl wget
      - name: Assert action ran (WSL-only action, expected to fail gracefully on Linux)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (WSL is not available on Linux runners)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
