name: Test with custom wsl-shell-command
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          distribution: Debian-12
          wsl-shell-command: bash --noprofile --norc -euo pipefail
          use-cache: 'false'
        continue-on-error: true
      - name: Assert action ran with custom shell command (outputs set or failed gracefully on non-Windows)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          WRAPPER_PATH: ${{ steps.action.outputs.wsl-shell-wrapper-path }}
          DIST_WRAPPER_PATH: ${{ steps.action.outputs.wsl-shell-distribution-wrapper-path }}
        run: |
          echo "outcome: $OUTCOME"
          echo "wsl-shell-wrapper-path: $WRAPPER_PATH"
          echo "wsl-shell-distribution-wrapper-path: $DIST_WRAPPER_PATH"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$WRAPPER_PATH" ]; then
              echo "FAIL: action succeeded but wsl-shell-wrapper-path output is empty"
              exit 1
            fi
            if [ -z "$DIST_WRAPPER_PATH" ]; then
              echo "FAIL: action succeeded but wsl-shell-distribution-wrapper-path output is empty"
              exit 1
            fi
            # The wrapper script name should be derived from the first word of wsl-shell-command
            # which is "bash", so the wrapper should be named "wsl-bash"
            echo "Checking wrapper path contains 'wsl-bash'..."
            if echo "$WRAPPER_PATH" | grep -q "wsl-bash"; then
              echo "PASS: wrapper path contains 'wsl-bash' as expected"
            else
              echo "FAIL: expected wrapper path to contain 'wsl-bash', got: $WRAPPER_PATH"
              exit 1
            fi
            echo "PASS: action succeeded with custom shell command"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (WSL not available on Linux/act runner)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
