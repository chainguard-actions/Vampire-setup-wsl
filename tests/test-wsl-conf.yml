name: Test wsl-conf configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          distribution: Ubuntu-22.04
          wsl-conf: |
            [automount]
            enabled = true
            root = /mnt/
            options = "metadata,umask=22,fmask=11"
            mountFsTab = false

            [network]
            generateHosts = true
            generateResolvConf = true

      - name: Assert action ran with wsl-conf
        env:
          OUTCOME: ${{ steps.action.outcome }}
          WRAPPER_PATH: ${{ steps.action.outputs.wsl-shell-wrapper-path }}
        run: |
          echo "outcome: $OUTCOME"
          echo "wsl-shell-wrapper-path: $WRAPPER_PATH"
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded — checking outputs"
            if [ -z "$WRAPPER_PATH" ]; then
              echo "FAIL: action succeeded but wsl-shell-wrapper-path is empty"
              exit 1
            fi
            echo "PASS: wsl-shell-wrapper-path='$WRAPPER_PATH'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (WSL is not available on Linux/act)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
